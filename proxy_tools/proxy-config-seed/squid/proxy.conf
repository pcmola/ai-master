# Squid forward proxy for wjy-proxy01.
# Deployed to /etc/proxy/proxy.conf on the VM and mounted read-only into the
# container as /etc/squid/squid.conf. Keep this file ASCII only.
# 8080 only: some client networks block outbound 3128 (2026-10-25)
http_port 8080

# Clients allowed to use the proxy (public IPs)
# Filled from PROXY_ALLOWED_CLIENTS in ai-master .env by setup_proxy_config.py
acl allowed_clients src 203.0.113.10/32

# Destination whitelist: one domain per line, a leading '.' includes subdomains
acl whitelist dstdomain "/etc/squid/lists/whitelist.txt"

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access allow allowed_clients whitelist
http_access deny all





coredump_dir /var/spool/squid
